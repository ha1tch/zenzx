<svg xmlns="http://www.w3.org/2000/svg" width="760" height="730" viewBox="0 0 760 730" font-family="'DejaVu Sans Mono','Menlo','Consolas',monospace" font-size="13">
  <title>Spectrum Next three-stage boot sequence</title>
  <desc>The Next boots in three stages, each handing off to the next via a NextREG-triggered soft reset: the FPGA boot ROM, TBBLUE.FW, and NextZXOS after the soft reset.</desc>

  <!-- Theme-robust palette: a translucent panel fill and a mid-grey ink that read on
       both light and dark backgrounds, with explicit strokes so nothing relies on the
       page colour. -->
  <style>
    .panel  { fill: #6b7d9611; stroke: #6b7d96; stroke-width: 1.5; rx: 8; }
    .s1 { stroke: #3b82a0; } .s1h { fill: #3b82a0; }
    .s2 { stroke: #8a6d3b; } .s2h { fill: #8a6d3b; }
    .s3 { stroke: #4a7a52; } .s3h { fill: #4a7a52; }
    .hd  { font-weight: bold; font-size: 14px; fill: #ffffff; }
    .sub { fill: #8a94a6; font-size: 11px; }
    .ln  { fill: #9aa4b2; }
    .reg { fill: #c08a3e; font-weight: bold; }
    .arrowlbl { fill: #8a94a6; font-size: 11px; font-style: italic; }
    .step { fill: #7d8796; }
  </style>

  <defs>
    <marker id="ar" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L7,3 L0,6 Z" fill="#6b7d96"/>
    </marker>
  </defs>

  <!-- ============ Stage 1 ============ -->
  <rect class="panel s1" x="40" y="20" width="680" height="150" rx="8"/>
  <rect class="s1h" x="40" y="20" width="680" height="26" rx="8"/>
  <rect class="s1h" x="40" y="34" width="680" height="12"/>
  <text class="hd" x="56" y="38">Stage 1 — Boot ROM phase</text>
  <text class="sub" x="700" y="38" text-anchor="end" fill="#e8edf2">FPGA 8K boot ROM "nextboot.rom"</text>
  <text class="ln" x="56" y="68">CMD12 → CMD0 → CMD8 → ACMD41 → CMD58   <tspan class="sub">(SD card init)</tspan></text>
  <text class="ln" x="56" y="88">reads <tspan class="step">TBBLUE.FW</tspan> from the SD card (~55 sectors)</text>
  <text class="ln" x="56" y="108"><tspan class="reg">NR 0x07=0x03</tspan>  CPU clock → 28 MHz for the fast load</text>
  <text class="ln" x="56" y="128"><tspan class="reg">NR 0x03=0xB0</tspan>  disable boot ROM, commit machine-type bits</text>
  <text class="ln" x="56" y="148"><tspan class="reg">JP 0x6000</tspan>     hand off to tbblue.fw</text>

  <!-- handoff 1 -->
  <line x1="380" y1="170" x2="380" y2="208" stroke="#6b7d96" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="arrowlbl" x="392" y="193">JP 0x6000</text>

  <!-- ============ Stage 2 ============ -->
  <rect class="panel s2" x="40" y="210" width="680" height="210" rx="8"/>
  <rect class="s2h" x="40" y="210" width="680" height="26" rx="8"/>
  <rect class="s2h" x="40" y="224" width="680" height="12"/>
  <text class="hd" x="56" y="228">Stage 2 — TBBLUE.FW</text>
  <text class="sub" x="700" y="228" text-anchor="end" fill="#e8edf2">loaded at 0x6000, SP=0xFFFF</text>
  <text class="ln" x="56" y="258">CMD12 → CMD0 → CMD8 → ACMD41 → CMD58   <tspan class="sub">(SD re-init, own driver)</tspan></text>
  <text class="ln" x="56" y="278">mounts the SD card's FAT32 volume, reads config.ini, menu.def</text>
  <text class="ln" x="56" y="298">checks core version · draws its boot screen · loads the keymap</text>
  <text class="ln" x="56" y="318">loads ROMs — DivMMC/Multiface/+3 ROM banks 0..3 into RAM</text>
  <text class="ln" x="56" y="338"><tspan class="sub">(via NextREG config-mode pages)</tspan></text>
  <text class="ln" x="56" y="358">initialises <tspan class="reg">NR 0x05,0x06,0x08,0x09,0x0A,0x82-0x85</tspan></text>
  <text class="ln" x="56" y="378"><tspan class="reg">NR 0x03=0xB3</tspan>  machine-type = +3, config mode OFF</text>
  <text class="ln" x="56" y="398"><tspan class="reg">NR 0x02=0x01</tspan>  soft reset — hands off to NextZXOS</text>

  <!-- handoff 2 -->
  <line x1="380" y1="420" x2="380" y2="458" stroke="#6b7d96" stroke-width="1.5" marker-end="url(#ar)"/>
  <text class="arrowlbl" x="392" y="443">NR 0x02=0x01 (soft reset)</text>

  <!-- ============ Stage 3 ============ -->
  <rect class="panel s3" x="40" y="460" width="680" height="250" rx="8"/>
  <rect class="s3h" x="40" y="460" width="680" height="26" rx="8"/>
  <rect class="s3h" x="40" y="474" width="680" height="12"/>
  <text class="hd" x="56" y="478">Stage 3 — post-soft-reset</text>
  <text class="sub" x="700" y="478" text-anchor="end" fill="#e8edf2">NextZXOS ROM now at 0x0000</text>
  <text class="ln" x="56" y="508">entry: <tspan class="step">DI ; JP 0x00EF</tspan></text>
  <text class="ln" x="56" y="528"><tspan class="reg">NR 0x07=3</tspan> (back to 3.5 MHz), <tspan class="reg">NR 0x03=0xB0</tspan>, <tspan class="reg">NR 0xC0=0x08</tspan> (stackless NMI)</text>
  <text class="ln" x="56" y="548"><tspan class="reg">NR 0x82-0x85=0xFF</tspan>; <tspan class="reg">NR 0x80/0x81/0x8A/0x8F=0</tspan></text>
  <text class="ln" x="56" y="568">LDIR clears the attribute area 0x5800-0x5AFF</text>
  <text class="ln" x="56" y="588">112-bank RAM test <tspan class="sub">(NR 0x56 swept 0x00..0xDE)</tspan></text>
  <text class="ln" x="56" y="608">peripheral init <tspan class="sub">(NR 0x05/0x06/0x08/0x0A/0xD8/0x8E/0xB8-0xBB/0xC0)</tspan></text>
  <text class="ln" x="56" y="628"><tspan class="step">LD SP,0x5BFF ; RST 0x20 ; IM 1</tspan></text>
  <text class="ln" x="56" y="648">control passes to NextZXOS proper <tspan class="sub">(welcome screen + main menu)</tspan></text>

  <text class="sub" x="56" y="682">Machine-type is <tspan class="reg">0xB3</tspan> ("+3") for all of stage 2 and the start of stage 3 —</text>
  <text class="sub" x="56" y="696">the classic baseline is the +3 model, not 128K.</text>
</svg>
